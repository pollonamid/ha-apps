---
configuration:
  speech_to_text_model:
    name: Speech-to-text model
    description: The speech-to-text model to use. It is downloaded on the first start.
  backend:
    name: Backend
    description: The inference backend to use. The Vulkan backend needs a GPU and falls back to the CPU when no device is found.
  threads:
    name: Threads
    description: The number of CPU threads used for inference.
  max_loaded_models:
    name: Maximum loaded models
    description: How many models may stay loaded in memory at the same time.
  tts_family:
    name: Text-to-speech family
    description: The model family used for speech synthesis. The Wyoming text-to-speech bridge offers every language of the family. A model is downloaded when it is used for the first time.
  hf_token:
    name: Hugging Face token
    description: A Hugging Face access token, needed for restricted or gated repositories. It is stored in the app and used for every download, also for the models installed from the web interface.
network:
  "8099/tcp": The port for the Audio.cpp HTTP API (OpenAI-compatible).
  "11301/tcp": The port for the Wyoming speech-to-text.
  "11201/tcp": The port for the Wyoming text-to-speech.
