name: Renovate

on:
  schedule:
    # Every hour in the evening and in the early morning, when the upstream
    # projects publish their releases.
    - "1,3,4,5,6,7,22-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
