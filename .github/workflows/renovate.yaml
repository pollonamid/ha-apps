name: Renovate

on:
  schedule:
    # Twice an hour, in the evening and in the early morning, when the
    # upstream projects publish their releases.
    - cron: "7,23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
